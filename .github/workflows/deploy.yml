name: SIT Deployment

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: sit

    steps:
      - name: Checkout Latest SIT Code
        uses: actions/checkout@v4
        with:
          ref: sit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: SIT Deployment
        run: echo "Latest SIT code deployed"