name: SIT Deployment Approval

on:
  pull_request:
    branches:
      - sit
    types:
      - closed

jobs:
  sit-validation:
    # Trigger only when PR is merged
    if: github.event.pull_request.merged == true

    runs-on: ubuntu-latest

    # GitHub Environment
    environment:
      name: sit

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Angular Application
        run: npm run build

      - name: SIT Validation Completed
        run: echo "SIT approval completed successfully"